
name: CI Pipeline with Sonar

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    name: Unit and API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run unit and API tests
        run: |
          export PYTHONPATH="$PWD"
          pytest tests/unit tests/api

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run security tools
        run: |
          pip install bandit pip-audit
          bandit -r app
          pip-audit || true

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          export PYTHONPATH="$PWD"
          pytest --cov=app --cov-report=xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [tests, security, sonar]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=terraform init -input=false

      - name: Get EC2 public IP from Terraform
        run: |
          ip=$(terraform -chdir=terraform output -raw ec2_public_ip)
          if [ -z "$ip" ]; then
            echo "ERROR: EC2 public IP not found"
            exit 1
          fi
          echo "EC2_HOST=$ip" >> $GITHUB_ENV
          echo "Resolved EC2_HOST=$ip"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

      - name: Deploy application
        run: |
          ssh ${{ secrets.EC2_USER }}@$EC2_HOST << 'EOF'
            set -e
            mkdir -p ~/apps
            cd ~/apps

            if [ ! -d "ci-cd-python-project" ]; then
              git clone https://github.com/${{ github.repository }}.git ci-cd-python-project
            fi

            cd ci-cd-python-project
            git pull origin main
            docker compose -f docker/docker-compose.yml up -d --build
          EOF