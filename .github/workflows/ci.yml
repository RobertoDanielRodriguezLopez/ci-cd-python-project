name: Continuous Integration

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ci-python-app -f docker/Dockerfile .

      - name: Run tests
        run: docker run ci-python-app
